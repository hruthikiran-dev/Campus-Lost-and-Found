<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Campus L&F</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav>
    <a href="index.html" class="logo">📦 Campus <span>L&F</span></a>
    <div class="nav-links">
      <a href="index.html">Browse</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </div>
  </nav>

  <div class="form-center">
    <div class="form-container">
      <div class="form-icon">🎓</div>
      <h2>Join Campus L&F</h2>
      <p class="form-subtitle">Help your campus community find lost items</p>

      <label>Full Name</label>
      <input type="text" id="name" placeholder="Your full name" />

      <label>Email</label>
      <input type="email" id="email" placeholder="your@email.com" />

      <label>Password</label>
      <input type="password" id="password" placeholder="Min 6 characters" />

      <button class="btn-primary" onclick="register()">Create Account →</button>
      <p id="register-message" class="message"></p>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Login here</a>
      </p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
